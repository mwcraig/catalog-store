[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalog-store-reader"
version = "0.1.0.dev0"
description = "Cone searches on an offline copy of an astronomical catalog stored as declination-zone Parquet files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "astropy>=6",
    "numpy>=1.26",
    "pyarrow>=15",
]

[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_store_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
