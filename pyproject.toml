[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalog-store"
version = "0.1.0.dev0"
description = "Offline copies of astronomical catalogs as declination-zone Parquet files: cone searches, a writer, and an ATLAS-REFCAT2 builder"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "astropy>=6",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.scripts]
build-refcat2-store = "catalog_store.refcat2:main"

[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
